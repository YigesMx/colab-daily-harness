[project]
name = "colab-daily"
version = "0.1.0"
description = "A modular AI workspace for collecting, reviewing, and publishing research updates."
requires-python = ">=3.10,<3.11"
dependencies = [
    "arxiv>=2.1,<3",
    "feedparser>=6.0,<7",
    "markdown-it-py>=3,<4",
    "pillow>=11,<12",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[tool.uv]
package = false
